name: Catalog package
on:
  push:
  pull_request:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python scripts/build_catalog.py --check
      - run: python -m unittest test_catalog_policy.py
      - run: python -m py_compile catalog/__init__.py
      - run: node --check catalog/desktop/plugin.js
      - run: node --test tests/*.test.mjs
        env:
          HERMES_TEST_CATALOG: '1'
      - run: npm run test:browser
